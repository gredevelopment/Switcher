name: Switcher
options:
  bundleIdPrefix: io.gredev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  Switcher:
    type: application
    platform: macOS
    sources:
      - path: Switcher
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: io.gredev.switcher
        PRODUCT_NAME: Switcher
        INFOPLIST_KEY_CFBundleDisplayName: Switcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Switcher/Switcher.entitlements
        DEVELOPMENT_TEAM: TN65L8H2L8
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Switcher/Switcher.entitlements
